[project]
name = "autonomous-market-os"
version = "0.1.0"
description = "Autonomous Market OS foundation slice"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "pyarrow>=18,<27",
]

[project.scripts]
market-os = "market_os.cli:main"

[tool.setuptools.packages.find]
include = ["market_os*"]

[tool.pytest.ini_options]
testpaths = ["market_os/tests"]
pythonpath = ["."]
markers = ["integration: executes actual optional reference-repository runtimes"]
