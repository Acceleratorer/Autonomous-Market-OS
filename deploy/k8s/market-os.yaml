apiVersion: v1
kind: Namespace
metadata:
  name: market-os
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-os
  namespace: market-os
  labels:
    app.kubernetes.io/name: market-os
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: market-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: market-os
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: runtime
          emptyDir: {}
        - name: python-tmp
          emptyDir: {}
        - name: next-tmp
          emptyDir: {}
      containers:
        - name: gateway
          image: autonomous-market-os/python:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "apps.gateway"]
          args: ["--host", "127.0.0.1", "--port", "8787"]
          env:
            - name: MARKET_OS_HOST
              value: "127.0.0.1"
            - name: MARKET_OS_PORT
              value: "8787"
            - name: MARKET_OS_STORE_ROOT
              value: "/var/lib/autonomous-market-os/state"
            - name: MARKET_OS_REQUEST_TIMEOUT
              value: "5"
            - name: MARKET_OS_SERVICE_LOG
              value: "/var/lib/autonomous-market-os/logs/python.jsonl"
          volumeMounts:
            - name: runtime
              mountPath: /var/lib/autonomous-market-os
            - name: python-tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen("http://127.0.0.1:8787/readyz", timeout=2).read()
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen("http://127.0.0.1:8787/healthz", timeout=2).read()
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
        - name: operator
          image: autonomous-market-os/next:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: MARKET_OS_API_PORT
              value: "8787"
            - name: MARKET_OS_U55_MODE
              value: "0"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: next-tmp
              mountPath: /tmp
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch("http://127.0.0.1:3000/healthz")
                  .then((r) => { if (!r.ok) process.exit(1); })
                  .catch(() => process.exit(1))
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  fetch("http://127.0.0.1:3000/healthz")
                  .then((r) => { if (!r.ok) process.exit(1); })
                  .catch(() => process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: market-os
  namespace: market-os
  labels:
    app.kubernetes.io/name: market-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: market-os
  ports:
    - name: http
      port: 3000
      targetPort: http
