services:
  gateway:
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
    environment:
      MARKET_OS_HOST: "127.0.0.1"
      MARKET_OS_PORT: "8787"
      MARKET_OS_STORE_ROOT: "/var/lib/autonomous-market-os/state"
      MARKET_OS_REQUEST_TIMEOUT: "5"
      MARKET_OS_SERVICE_LOG: "/var/lib/autonomous-market-os/logs/python.jsonl"
    volumes:
      - market-os-runtime:/var/lib/autonomous-market-os
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8787/readyz", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:5000:5000"

  operator:
    build:
      context: .
      dockerfile: deploy/docker/next.Dockerfile
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MARKET_OS_API_PORT: "8787"
      MARKET_OS_U55_MODE: "0"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:9090
    read_only: true
    tmpfs:
      - /prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  promtail:
    image: grafana/promtail:3.4.2
    profiles: [observability]
    network_mode: "service:gateway"
    depends_on:
      gateway:
        condition: service_healthy
      loki:
        condition: service_started
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - market-os-runtime:/var/lib/autonomous-market-os:ro
    command: -config.file=/etc/promtail/config.yml
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    network_mode: "service:gateway"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$GRAFANA_ADMIN_PASSWORD" || { echo "GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; };
        export GF_SECURITY_ADMIN_PASSWORD="$$GRAFANA_ADMIN_PASSWORD";
        exec /run.sh
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    profiles: [mlops]
    network_mode: "service:gateway"
    volumes:
      - mlflow-data:/mlflow
    command:
      - mlflow
      - server
      - --host
      - 127.0.0.1
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  market-os-runtime:
  loki-data:
  grafana-data:
  mlflow-data:
