name: Security and package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/next-operator/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Install and audit Next.js dependencies
        working-directory: apps/web/next-operator
        run: pnpm install --frozen-lockfile && pnpm audit --audit-level high
      - name: Dependency consistency
        run: python -m pip check
      - name: High-confidence secret scan
        run: python scripts/ci_checks.py secret-scan
      - name: Evidence JSON validation
        run: python scripts/ci_checks.py validate-evidence
      - name: M2.8 live-smoke evidence gate
        run: python scripts/ci_checks.py validate-m2-8-evidence
      - name: Model boundary and paper-only tests
        run: python -m pytest -q market_os/tests/test_openai_summary_adapter.py market_os/tests/test_model_summary.py
      - name: Compile and diff checks
        run: python -m compileall -q market_os && git diff --check
      - name: Validate MLOps contract manifest
        run: python scripts/ci_checks.py validate-mlops-manifest
