name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/next-operator/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Install local Next.js operator dependencies
        working-directory: apps/web/next-operator
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build local Next.js operator
        working-directory: apps/web/next-operator
        run: pnpm run typecheck && pnpm run build
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Offline integration-marked tests
        run: python -m pytest -q -m integration
      - name: Full test suite
        run: python -m pytest -q
      - name: Render U7-G quality benchmark report
        run: >-
          market-os benchmark report
          --store-root "${{ runner.temp }}/market-os-u7-g/store"
          --fixture market_os/tests/fixtures/quality/benchmark.json
          --markdown "${{ runner.temp }}/market-os-u7-g/quality-benchmark-report.md"
          --json "${{ runner.temp }}/market-os-u7-g/quality-benchmark-report.json"
      - name: Upload U7-G quality benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-g-quality-benchmark
          path: |
            ${{ runner.temp }}/market-os-u7-g/quality-benchmark-report.md
            ${{ runner.temp }}/market-os-u7-g/quality-benchmark-report.json
            ${{ runner.temp }}/market-os-u7-g/store/benchmarks/**
          if-no-files-found: error
      - name: Render U7-H synthetic session accounting report
        run: >-
          market-os synthetic report
          --fixture market_os/tests/fixtures/b38/synthetic_session.json
          --output-dir "${{ runner.temp }}/market-os-u7-h/session"
          --markdown "${{ runner.temp }}/market-os-u7-h/synthetic-session-report.md"
          --json "${{ runner.temp }}/market-os-u7-h/synthetic-session-report.json"
      - name: Upload U7-H synthetic session evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-h-synthetic-session
          path: |
            ${{ runner.temp }}/market-os-u7-h/synthetic-session-report.md
            ${{ runner.temp }}/market-os-u7-h/synthetic-session-report.json
            ${{ runner.temp }}/market-os-u7-h/session/**
          if-no-files-found: error
      - name: Render U7-I local evidence pack
        run: >-
          python -m market_os.evidence_pack
          --release docs/evidence/u7-f-cross-target-release-catalog-report.json
          --quality docs/evidence/u7-g-quality-benchmark-report.json
          --session docs/evidence/u7-h-synthetic-session-accounting-report.json
          --markdown "${{ runner.temp }}/market-os-u7-i/local-evidence-pack.md"
          --json "${{ runner.temp }}/market-os-u7-i/local-evidence-pack.json"
      - name: Upload U7-I local evidence pack
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-i-local-evidence-pack
          path: |
            ${{ runner.temp }}/market-os-u7-i/local-evidence-pack.md
            ${{ runner.temp }}/market-os-u7-i/local-evidence-pack.json
          if-no-files-found: error
      - name: Render U7-N unified evidence register
        run: >-
          python -m market_os.u7_evidence_register
          --pack docs/evidence/u7-i-local-evidence-pack.json
          --drift docs/evidence/u7-m-release-evidence-drift.json
          --markdown "${{ runner.temp }}/market-os-u7-n/unified-evidence-register.md"
          --json "${{ runner.temp }}/market-os-u7-n/unified-evidence-register.json"
      - name: Upload U7-N unified evidence register
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-n-unified-evidence-register
          path: |
            ${{ runner.temp }}/market-os-u7-n/unified-evidence-register.md
            ${{ runner.temp }}/market-os-u7-n/unified-evidence-register.json
          if-no-files-found: error
      - name: Render U7-J synthetic economic report
        run: >-
          market-os synthetic economic-report
          --fixture market_os/tests/fixtures/economic/u7_j_synthetic_economic.json
          --markdown "${{ runner.temp }}/market-os-u7-j/economic-report.md"
          --json "${{ runner.temp }}/market-os-u7-j/economic-report.json"
      - name: Upload U7-J synthetic economic evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-j-synthetic-economic
          path: |
            ${{ runner.temp }}/market-os-u7-j/economic-report.md
            ${{ runner.temp }}/market-os-u7-j/economic-report.json
          if-no-files-found: error
      - name: Render U7-K CLI tool registry audit
        run: >-
          python -m market_os.tool_registry_report
          --fixture market_os/tests/fixtures/tools/u7_k_cli_anything_registry.json
          --markdown "${{ runner.temp }}/market-os-u7-k/tool-registry.md"
          --json "${{ runner.temp }}/market-os-u7-k/tool-registry.json"
      - name: Upload U7-K CLI tool registry evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-k-cli-tool-registry
          path: |
            ${{ runner.temp }}/market-os-u7-k/tool-registry.md
            ${{ runner.temp }}/market-os-u7-k/tool-registry.json
          if-no-files-found: error
      - name: Render U7-L Paper2Slides research brief
        run: >-
          market-os research-brief
          --source market_os/tests/fixtures/research/u7_l_cited_research.json
          --markdown "${{ runner.temp }}/market-os-u7-l/research-brief.md"
          --json "${{ runner.temp }}/market-os-u7-l/research-brief-evidence.json"
      - name: Upload U7-L research brief evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-l-paper2slides-research-brief
          path: |
            ${{ runner.temp }}/market-os-u7-l/research-brief.md
            ${{ runner.temp }}/market-os-u7-l/research-brief-evidence.json
          if-no-files-found: error
      - name: Render U7-O evidence catalog
        run: >-
          python -m market_os.u7_evidence_catalog
          --register "${{ runner.temp }}/market-os-u7-n/unified-evidence-register.json"
          --economic "${{ runner.temp }}/market-os-u7-j/economic-report.json"
          --tools "${{ runner.temp }}/market-os-u7-k/tool-registry.json"
          --research "${{ runner.temp }}/market-os-u7-l/research-brief-evidence.json"
          --markdown "${{ runner.temp }}/market-os-u7-o/evidence-catalog.md"
          --json "${{ runner.temp }}/market-os-u7-o/evidence-catalog.json"
      - name: Upload U7-O evidence catalog
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-o-evidence-catalog
          path: |
            ${{ runner.temp }}/market-os-u7-o/evidence-catalog.md
            ${{ runner.temp }}/market-os-u7-o/evidence-catalog.json
          if-no-files-found: error
      - name: Render U8-A live-readiness decision pack
        run: >-
          python -m market_os.u8a_readiness
          --local-exit docs/evidence/local-exit-gate.json
          --stack docs/evidence/u5-5-stack-runtime-review.json
          --promotion docs/evidence/u5-5-promotion-evidence.json
          --browser docs/evidence/u5-5-connected-browser-smoke.json
          --release docs/evidence/u6-4-release-hardening.json
          --u7 "${{ runner.temp }}/market-os-u7-o/evidence-catalog.json"
          --markdown "${{ runner.temp }}/market-os-u8-a/live-readiness-decision.md"
          --json "${{ runner.temp }}/market-os-u8-a/live-readiness-decision.json"
      - name: Upload U8-A live-readiness decision pack
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u8-a-live-readiness-decision
          path: |
            ${{ runner.temp }}/market-os-u8-a/live-readiness-decision.md
            ${{ runner.temp }}/market-os-u8-a/live-readiness-decision.json
          if-no-files-found: error
      - name: Render U8-B local operational readiness pack
        run: >-
          python -m market_os.u8b_operations
          --observability docs/evidence/u5-3-deployment-access-observability.json
          --retention docs/evidence/b4-20-retention-archive-preflight.json
          --platform docs/evidence/platform-toolchain-readiness.json
          --release docs/evidence/u6-4-release-hardening.json
          --u8-a "${{ runner.temp }}/market-os-u8-a/live-readiness-decision.json"
          --markdown "${{ runner.temp }}/market-os-u8-b/local-operational-readiness.md"
          --json "${{ runner.temp }}/market-os-u8-b/local-operational-readiness.json"
      - name: Upload U8-B local operational readiness pack
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u8-b-local-operational-readiness
          path: |
            ${{ runner.temp }}/market-os-u8-b/local-operational-readiness.md
            ${{ runner.temp }}/market-os-u8-b/local-operational-readiness.json
          if-no-files-found: error
      - name: Render U8-C permanent paper-only decision
        run: >-
          python -m market_os.u8c_paper_mode
          --u8-a "${{ runner.temp }}/market-os-u8-a/live-readiness-decision.json"
          --u8-b "${{ runner.temp }}/market-os-u8-b/local-operational-readiness.json"
          --decision permanent-paper-only
          --markdown "${{ runner.temp }}/market-os-u8-c/permanent-paper-only.md"
          --json "${{ runner.temp }}/market-os-u8-c/permanent-paper-only.json"
      - name: Upload U8-C permanent paper-only decision
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u8-c-permanent-paper-only
          path: |
            ${{ runner.temp }}/market-os-u8-c/permanent-paper-only.md
            ${{ runner.temp }}/market-os-u8-c/permanent-paper-only.json
          if-no-files-found: error
      - name: Compile Python sources
        run: python -m compileall -q market_os
      - name: Evidence JSON
        run: python scripts/ci_checks.py validate-evidence
      - name: M2.8 live-smoke evidence gate
        run: python scripts/ci_checks.py validate-m2-8-evidence
      - name: CLI and API smoke tests
        run: >-
          python -m pytest -q
          market_os/tests/test_quality_benchmark.py::test_cli_runs_and_inspects_benchmark
          market_os/tests/test_quality_benchmark.py::test_api_runs_and_inspects_benchmark_without_trading_state
          market_os/tests/test_openai_summary_adapter.py::test_default_selection_does_not_import_or_call_openai
      - name: Diff check
        run: git diff --check
      - name: TypeScript dashboard contract test
        run: pnpm dlx tsx tests/market-os-readonly-dashboard.test.ts
      - name: Verify web preview compatibility copy
        run: python scripts/build_web_artifact.py --check
      - name: Verify static deployment readiness
        run: python -m pytest -q market_os/tests/test_app_surfaces.py::test_web_artifact_packaging_is_exact_and_deterministic
      - name: Verify application surfaces
        run: python -m pytest -q market_os/tests/test_app_surfaces.py
      - name: Verify local operator surface
        run: python -m pytest -q market_os/tests/test_operator_surface.py
      - name: Validate MLOps contract manifest
        run: python scripts/ci_checks.py validate-mlops-manifest

  package-readonly-dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage paper-only read-only dashboard
        run: python scripts/build_web_artifact.py --output site/market-os --manifest site/market-os.manifest.json
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: market-os-readonly-dashboard
          path: |
            site/market-os
            site/market-os.manifest.json
          if-no-files-found: error

  u6-4-release-contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/electron/pnpm-lock.yaml
      - name: Install Electron shell dependencies
        working-directory: apps/desktop/electron
        run: pnpm install --frozen-lockfile
      - name: Verify signing and release slot contract
        working-directory: apps/desktop/electron
        run: pnpm test
      - name: Verify U6.4 source contract
        run: pnpm dlx tsx tests/market-os-u6-4-artifact.test.ts

  u6-4-release-hardening:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/web/next-operator/pnpm-lock.yaml
            apps/desktop/electron/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python sidecar dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Install and build Next.js renderer
        working-directory: apps/web/next-operator
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Install Electron shell dependencies
        working-directory: apps/desktop/electron
        run: pnpm install --frozen-lockfile
      - name: Download target-native Electron runtime
        working-directory: apps/desktop/electron
        run: pnpm exec install-electron
      - name: Build, sign, smoke, promote, and rollback two target-native artifacts (Windows)
        if: matrix.target == 'windows-x64'
        working-directory: apps/desktop/electron
        run: pnpm run release:ci -- --target "${{ matrix.target }}" --output "${{ runner.temp }}/market-os-u6-4"
      - name: Build, sign, smoke, promote, and rollback two target-native artifacts (Linux)
        if: matrix.target == 'linux-x64'
        working-directory: apps/desktop/electron
        run: xvfb-run -a pnpm run release:ci -- --target "${{ matrix.target }}" --output "${{ runner.temp }}/market-os-u6-4"
      - name: Validate U6.4-C evidence bundle
        working-directory: apps/desktop/electron
        run: pnpm run release:validate -- --root "${{ runner.temp }}/market-os-u6-4" --report "${{ runner.temp }}/market-os-u6-4/ci-evidence-validation.json"
      - name: Run U6.4-D installer preflight
        working-directory: apps/desktop/electron
        run: pnpm run install:preflight -- --artifact "${{ runner.temp }}/market-os-u6-4/artifact-candidate" --target "${{ matrix.target }}" --require-signed --json "${{ runner.temp }}/market-os-u6-4/install-preflight.json" --markdown "${{ runner.temp }}/market-os-u6-4/install-preflight.md"
      - name: Archive target-native artifacts
        working-directory: apps/desktop/electron
        run: |
          pnpm run release:archive -- --artifact "${{ runner.temp }}/market-os-u6-4/artifact-known-good" --output "${{ runner.temp }}/market-os-u6-4/market-os-${{ matrix.target }}-known-good.tar.gz" --report "${{ runner.temp }}/market-os-u6-4/portable-archive-known-good.json"
          pnpm run release:archive -- --artifact "${{ runner.temp }}/market-os-u6-4/artifact-candidate" --output "${{ runner.temp }}/market-os-u6-4/market-os-${{ matrix.target }}-candidate.tar.gz" --report "${{ runner.temp }}/market-os-u6-4/portable-archive-candidate.json"
      - name: Index and verify portable archives
        working-directory: apps/desktop/electron
        run: pnpm run release:index -- --root "${{ runner.temp }}/market-os-u6-4"
      - name: Render U7-B release evidence report
        working-directory: apps/desktop/electron
        run: pnpm run release:report -- --root "${{ runner.temp }}/market-os-u6-4"
      - name: Upload U6.4-C CI evidence
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u6-4-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/market-os-u6-4/ci-evidence.json
            ${{ runner.temp }}/market-os-u6-4/ci-evidence-validation.json
            ${{ runner.temp }}/market-os-u6-4/release-evidence-report.md
            ${{ runner.temp }}/market-os-u6-4/release-evidence-report.json
            ${{ runner.temp }}/market-os-u6-4/install-preflight.json
            ${{ runner.temp }}/market-os-u6-4/install-preflight.md
            ${{ runner.temp }}/market-os-u6-4/market-os-${{ matrix.target }}-known-good.tar.gz
            ${{ runner.temp }}/market-os-u6-4/market-os-${{ matrix.target }}-candidate.tar.gz
            ${{ runner.temp }}/market-os-u6-4/portable-archive-*.json
            ${{ runner.temp }}/market-os-u6-4/portable-archive-index.json
            ${{ runner.temp }}/market-os-u6-4/release-drill.json
            ${{ runner.temp }}/market-os-u6-4/smoke-*.json
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/artifact-manifest.json
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/artifact-manifest.json.sha256
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/release-signature.json
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/artifact-manifest.json
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/artifact-manifest.json.sha256
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/release-signature.json
          if-no-files-found: error

  u7-release-catalog:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: u6-4-release-hardening
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/electron/pnpm-lock.yaml
      - name: Download Windows release evidence
        uses: actions/download-artifact@v8
        with:
          name: market-os-u6-4-windows-x64
          path: ${{ runner.temp }}/market-os-u7/windows-x64
      - name: Download Linux release evidence
        uses: actions/download-artifact@v8
        with:
          name: market-os-u6-4-linux-x64
          path: ${{ runner.temp }}/market-os-u7/linux-x64
      - name: Build cross-target release catalog
        working-directory: apps/desktop/electron
        run: pnpm run release:catalog -- --windows "${{ runner.temp }}/market-os-u7/windows-x64" --linux "${{ runner.temp }}/market-os-u7/linux-x64" --output "${{ runner.temp }}/market-os-u7/cross-target-release-catalog.json"
      - name: Render cross-target catalog report
        working-directory: apps/desktop/electron
        run: >-
          pnpm run release:catalog:report --
          --catalog "${{ runner.temp }}/market-os-u7/cross-target-release-catalog.json"
          --markdown "${{ runner.temp }}/market-os-u7/cross-target-release-catalog.md"
          --json "${{ runner.temp }}/market-os-u7/cross-target-release-catalog-report.json"
      - name: Audit U7-M release evidence drift
        working-directory: apps/desktop/electron
        run: >-
          pnpm run release:drift --
          --windows "${{ runner.temp }}/market-os-u7/windows-x64"
          --linux "${{ runner.temp }}/market-os-u7/linux-x64"
          --catalog "${{ runner.temp }}/market-os-u7/cross-target-release-catalog.json"
          --markdown "${{ runner.temp }}/market-os-u7/release-evidence-drift.md"
          --json "${{ runner.temp }}/market-os-u7/release-evidence-drift.json"
      - name: Upload cross-target release catalog
        uses: actions/upload-artifact@v7
        with:
          name: market-os-u7-release-catalog
          path: |
            ${{ runner.temp }}/market-os-u7/cross-target-release-catalog.json
            ${{ runner.temp }}/market-os-u7/cross-target-release-catalog.md
            ${{ runner.temp }}/market-os-u7/cross-target-release-catalog-report.json
            ${{ runner.temp }}/market-os-u7/release-evidence-drift.md
            ${{ runner.temp }}/market-os-u7/release-evidence-drift.json
          if-no-files-found: error

  container-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Python gateway image
        run: docker build -f deploy/docker/python.Dockerfile -t autonomous-market-os/python:ci .
      - name: Build Next.js operator image
        run: docker build -f deploy/docker/next.Dockerfile -t autonomous-market-os/next:ci .
      - name: Validate Compose configuration
        run: docker compose config
