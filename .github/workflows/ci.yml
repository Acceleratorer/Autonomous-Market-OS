name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/next-operator/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Install local Next.js operator dependencies
        working-directory: apps/web/next-operator
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build local Next.js operator
        working-directory: apps/web/next-operator
        run: pnpm run typecheck && pnpm run build
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Offline integration-marked tests
        run: python -m pytest -q -m integration
      - name: Full test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q market_os
      - name: Evidence JSON
        run: python scripts/ci_checks.py validate-evidence
      - name: M2.8 live-smoke evidence gate
        run: python scripts/ci_checks.py validate-m2-8-evidence
      - name: CLI and API smoke tests
        run: >-
          python -m pytest -q
          market_os/tests/test_quality_benchmark.py::test_cli_runs_and_inspects_benchmark
          market_os/tests/test_quality_benchmark.py::test_api_runs_and_inspects_benchmark_without_trading_state
          market_os/tests/test_openai_summary_adapter.py::test_default_selection_does_not_import_or_call_openai
      - name: Diff check
        run: git diff --check
      - name: TypeScript dashboard contract test
        run: pnpm dlx tsx tests/market-os-readonly-dashboard.test.ts
      - name: Verify web preview compatibility copy
        run: python scripts/build_web_artifact.py --check
      - name: Verify static deployment readiness
        run: python -m pytest -q market_os/tests/test_app_surfaces.py::test_web_artifact_packaging_is_exact_and_deterministic
      - name: Verify application surfaces
        run: python -m pytest -q market_os/tests/test_app_surfaces.py
      - name: Verify local operator surface
        run: python -m pytest -q market_os/tests/test_operator_surface.py
      - name: Validate MLOps contract manifest
        run: python scripts/ci_checks.py validate-mlops-manifest

  package-readonly-dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage paper-only read-only dashboard
        run: python scripts/build_web_artifact.py --output site/market-os --manifest site/market-os.manifest.json
      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-os-readonly-dashboard
          path: |
            site/market-os
            site/market-os.manifest.json
          if-no-files-found: error

  u6-4-release-contract:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/electron/pnpm-lock.yaml
      - name: Install Electron shell dependencies
        working-directory: apps/desktop/electron
        run: pnpm install --frozen-lockfile
      - name: Verify signing and release slot contract
        working-directory: apps/desktop/electron
        run: pnpm test
      - name: Verify U6.4 source contract
        run: pnpm dlx tsx tests/market-os-u6-4-artifact.test.ts

  u6-4-release-hardening:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/web/next-operator/pnpm-lock.yaml
            apps/desktop/electron/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python sidecar dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Install and build Next.js renderer
        working-directory: apps/web/next-operator
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Install Electron shell dependencies
        working-directory: apps/desktop/electron
        run: pnpm install --frozen-lockfile
      - name: Download target-native Electron runtime
        working-directory: apps/desktop/electron
        run: pnpm exec install-electron
      - name: Build, sign, smoke, promote, and rollback two target-native artifacts (Windows)
        if: matrix.target == 'windows-x64'
        working-directory: apps/desktop/electron
        run: pnpm run release:ci -- --target "${{ matrix.target }}" --output "${{ runner.temp }}/market-os-u6-4"
      - name: Build, sign, smoke, promote, and rollback two target-native artifacts (Linux)
        if: matrix.target == 'linux-x64'
        working-directory: apps/desktop/electron
        run: xvfb-run -a pnpm run release:ci -- --target "${{ matrix.target }}" --output "${{ runner.temp }}/market-os-u6-4"
      - name: Upload U6.4-C CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-os-u6-4-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/market-os-u6-4/ci-evidence.json
            ${{ runner.temp }}/market-os-u6-4/release-drill.json
            ${{ runner.temp }}/market-os-u6-4/smoke-*.json
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/artifact-manifest.json
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/artifact-manifest.json.sha256
            ${{ runner.temp }}/market-os-u6-4/artifact-known-good/release-signature.json
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/artifact-manifest.json
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/artifact-manifest.json.sha256
            ${{ runner.temp }}/market-os-u6-4/artifact-candidate/release-signature.json
          if-no-files-found: error

  container-build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: offline-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Python gateway image
        run: docker build -f deploy/docker/python.Dockerfile -t autonomous-market-os/python:ci .
      - name: Build Next.js operator image
        run: docker build -f deploy/docker/next.Dockerfile -t autonomous-market-os/next:ci .
      - name: Validate Compose configuration
        run: docker compose config
