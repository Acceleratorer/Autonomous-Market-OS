name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test runner
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest -q -m "not integration"
      - name: Offline integration-marked tests
        run: python -m pytest -q -m integration
      - name: Full test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q market_os
      - name: Evidence JSON
        run: python scripts/ci_checks.py validate-evidence
      - name: M2.8 live-smoke evidence gate
        run: python scripts/ci_checks.py validate-m2-8-evidence
      - name: CLI and API smoke tests
        run: >-
          python -m pytest -q
          market_os/tests/test_m2_quality_benchmark.py::test_cli_runs_and_inspects_benchmark
          market_os/tests/test_m2_quality_benchmark.py::test_api_runs_and_inspects_benchmark_without_trading_state
          market_os/tests/test_m2_openai_summary.py::test_default_selection_does_not_import_or_call_openai
      - name: Diff check
        run: git diff --check
