server:
  http_listen_address: 127.0.0.1
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: market-os-jsonl
    static_configs:
      - targets: [localhost]
        labels:
          job: market-os
          __path__: /var/lib/autonomous-market-os/logs/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            event: event
            status: status
            error_type: error_type
      - labels:
          event:
          status:
          error_type:
